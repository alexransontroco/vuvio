<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Vuvio — Globe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#05101f;
    --bg-2:#0a1830;
    --ocean:#0b1a2e;
    --panel: rgba(9,20,38,.72);
    --line: rgba(115,161,255,.18);
    --line-2: rgba(39,208,255,.26);
    --text:#eaf2ff;
    --muted:#9fb2cc;
    --muted-2:#6f84a7;
    --cyan:#14d7ff;
    --cyan-2:#53f5ff;
    --blue:#67a1ff;
    --green:#4ee09f;
    --orange:#ff9e55;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); overflow:hidden;
    font-family:'Inter',sans-serif;
    -webkit-tap-highlight-color:transparent;
    color:var(--text);
  }
  canvas#scene{
    position:fixed; inset:0; width:100%; height:100%;
    display:block; touch-action:none;
    opacity:0; transition:opacity 1.1s ease;
  }
  canvas#scene.ready{opacity:1;}

  .ui{ position:fixed; inset:0; pointer-events:none; opacity:0; transition:opacity .9s ease .25s; }
  .ui.ready{opacity:1;}

  /* Top bar */
  .topbar{
    position:absolute; top:0; left:0; right:0;
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg, rgba(5,16,31,.85), rgba(5,16,31,0));
  }
  .brand{ display:flex; align-items:center; gap:8px; }
  .brand-mark{
    font-weight:800; font-size:19px; letter-spacing:-.01em;
    background:linear-gradient(90deg, var(--cyan-2), var(--blue));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .brand-sub{ font-size:10px; color:var(--muted-2); text-transform:uppercase; letter-spacing:.14em; margin-top:1px; }

  .live-counter{
    display:flex; align-items:center; gap:7px;
    padding:7px 12px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line-2);
    backdrop-filter:blur(10px);
    font-size:12px; font-weight:600; pointer-events:auto;
  }
  .live-dot{
    width:7px; height:7px; border-radius:50%; background:var(--orange);
    box-shadow:0 0 8px var(--orange);
    animation:pulseDot 1.6s ease-in-out infinite;
  }
  @keyframes pulseDot{ 0%,100%{opacity:1; transform:scale(1);} 50%{opacity:.5; transform:scale(.7);} }

  /* Category legend / filter pills */
  .filters{
    position:absolute; top:78px; left:0; right:0;
    display:flex; gap:8px; justify-content:center; flex-wrap:wrap;
    padding:0 16px; pointer-events:none;
  }
  .pill{
    pointer-events:auto;
    display:flex; align-items:center; gap:6px;
    padding:8px 14px; border-radius:999px;
    background:var(--panel); border:1px solid var(--line);
    backdrop-filter:blur(10px);
    font-size:12px; font-weight:600; color:var(--muted);
    cursor:pointer; transition:all .2s ease;
    -webkit-user-select:none; user-select:none;
  }
  .pill .dot{ width:8px; height:8px; border-radius:50%; }
  .pill.active{ color:var(--text); border-color:var(--pill-color); box-shadow:0 0 0 1px var(--pill-color) inset, 0 0 16px -4px var(--pill-color); }
  .pill.dim{ opacity:.35; }

  /* Hint */
  .hint{
    position:absolute; bottom:126px; left:50%; transform:translateX(-50%);
    font-size:11px; color:var(--muted-2); letter-spacing:.06em; text-transform:uppercase;
    white-space:nowrap; transition:opacity .4s ease;
  }

  /* Detail card */
  .card{
    position:absolute; left:14px; right:14px; bottom:100px;
    max-width:420px; margin:0 auto;
    padding:16px 18px; border-radius:16px;
    background:linear-gradient(180deg, rgba(11,24,44,.92), rgba(8,17,32,.94));
    border:1px solid var(--line-2);
    box-shadow:0 20px 50px -12px rgba(0,0,0,.55);
    pointer-events:auto;
    opacity:0; transform:translateY(14px) scale(.98);
    transition:opacity .3s ease, transform .3s ease;
  }
  .card.show{ opacity:1; transform:translateY(0) scale(1); }
  .card-top{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .card-cat{
    display:flex; align-items:center; gap:6px;
    font-size:10px; text-transform:uppercase; letter-spacing:.12em; font-weight:700;
  }
  .card-cat .dot{ width:7px; height:7px; border-radius:50%; }
  .card-status{
    display:flex; align-items:center; gap:5px;
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
  }
  .card-status.live{ color:var(--orange); }
  .card-status.upcoming{ color:var(--muted); }
  .card-status .sd{ width:6px; height:6px; border-radius:50%; background:currentColor; }
  .card-title{ font-size:17px; font-weight:700; margin-bottom:3px; }
  .card-sub{ font-size:12.5px; color:var(--muted); margin-bottom:12px; line-height:1.45; }
  .card-row{ display:flex; align-items:center; justify-content:space-between; }
  .card-meta{ display:flex; gap:14px; font-size:11.5px; color:var(--muted-2); }
  .card-meta b{ color:var(--text); font-weight:700; }
  .card-btn{
    padding:8px 16px; border-radius:10px; border:none; cursor:pointer;
    font-size:12.5px; font-weight:700; letter-spacing:.02em;
    background:linear-gradient(90deg, var(--cyan), var(--blue)); color:#04101f;
  }

  /* Bottom nav */
  .navbar{
    position:absolute; bottom:0; left:0; right:0;
    padding:10px 18px calc(14px + env(safe-area-inset-bottom));
    display:flex; align-items:center; justify-content:space-around;
    background:linear-gradient(0deg, rgba(5,16,31,.92), rgba(5,16,31,0));
    pointer-events:auto;
  }
  .nav-item{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--muted-2); cursor:pointer;
    -webkit-user-select:none; user-select:none;
  }
  .nav-item svg{ width:21px; height:21px; }
  .nav-item span{ font-size:9.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em; }
  .nav-item.active{ color:var(--cyan-2); }
  .nav-item.active svg{ filter:drop-shadow(0 0 6px rgba(20,215,255,.55)); }

  @media (max-width:380px){
    .filters{ top:74px; }
    .pill{ padding:7px 11px; font-size:11px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="ui" id="ui">
  <div class="topbar">
    <div class="brand">
      <div>
        <div class="brand-mark">Vuvio</div>
        <div class="brand-sub">Globe</div>
      </div>
    </div>
    <div class="live-counter"><span class="live-dot"></span><span id="liveCount">0 live now</span></div>
  </div>

  <div class="filters" id="filters"></div>

  <div class="hint" id="hint">Drag to explore · tap a point</div>

  <div class="card" id="card">
    <div class="card-top">
      <div class="card-cat"><span class="dot" id="cardDot"></span><span id="cardCat"></span></div>
      <div class="card-status" id="cardStatus"><span class="sd"></span><span id="cardStatusText"></span></div>
    </div>
    <div class="card-title" id="cardTitle"></div>
    <div class="card-sub" id="cardSub"></div>
    <div class="card-row">
      <div class="card-meta">
        <span id="cardViewers"></span>
        <span id="cardLocation"></span>
      </div>
      <button class="card-btn" id="cardBtn">Watch</button>
    </div>
  </div>

  <div class="navbar">
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg><span>Home</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg><span>Discover</span></div>
    <div class="nav-item active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 4 6 4 9s-1.5 6.4-4 9c-2.5-2.6-4-6-4-9s1.5-6.4 4-9z"/></svg><span>Globe</span></div>
    <div class="nav-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.8-4 5-6 8-6s6.2 2 8 6"/></svg><span>Profile</span></div>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ------------------------------------------------------------------
   Vuvio — Globe
   Live POV map: Air / Land / Water categories, points show live
   or upcoming broadcasts, halo + counters + sliding filters.
   No external texture assets — continents drawn procedurally.
-------------------------------------------------------------------*/

const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const R = 2;

const CATS = {
  air:   { css:'#67a1ff', hex:0x67a1ff, label:'Air' },
  land:  { css:'#4ee09f', hex:0x4ee09f, label:'Land' },
  water: { css:'#14d7ff', hex:0x14d7ff, label:'Water' },
};

const CONTINENTS = [
  [[-17,15],[-16,10],[-10,6],[3,6],[10,4],[20,0],[30,-2],[40,-5],[42,-12],
   [40,-18],[35,-24],[27,-33],[20,-34],[15,-28],[12,-17],[9,-5],[3,4],[-8,10],[-17,15]],
  [[-9,37],[-9,43],[-2,48],[2,51],[8,54],[15,55],[22,54],[28,45],[34,42],
   [26,40],[16,38],[6,36],[-3,37],[-9,37]],
  [[27,42],[35,48],[45,50],[55,52],[65,55],[80,58],[95,62],[112,60],
   [128,58],[140,50],[142,40],[135,32],[122,24],[105,10],[97,6],[85,10],
   [75,18],[65,25],[55,28],[45,32],[35,36],[27,42]],
  [[-162,60],[-155,68],[-140,68],[-125,58],[-124,48],[-122,38],[-108,30],
   [-97,20],[-88,16],[-80,25],[-75,35],[-68,45],[-58,50],[-65,58],
   [-90,58],[-110,60],[-130,55],[-145,60],[-162,60]],
  [[-80,10],[-77,2],[-70,-4],[-70,-15],[-68,-22],[-70,-30],[-72,-40],
   [-74,-50],[-68,-53],[-63,-45],[-58,-34],[-48,-25],[-35,-10],
   [-50,2],[-60,8],[-72,11],[-80,10]],
  [[113,-22],[118,-17],[130,-12],[142,-11],[148,-19],[153,-28],
   [150,-38],[140,-38],[132,-32],[122,-34],[114,-32],[113,-22]],
  [[-46,60],[-38,66],[-28,71],[-22,78],[-35,83],[-52,80],[-56,70],[-49,62],[-46,60]],
];

const POINTS = [
  { name:'Alpine Wingsuit Line',  activity:'Wingsuit flight over the Aiguille du Midi', lat:45.83, lon:6.87,   cat:'air',   status:'live',     viewers:'2.1k', place:'Chamonix, FR' },
  { name:'Dawn Balloon Ride',     activity:'Sunrise hot air balloon crossing',          lat:38.72, lon:34.83,  cat:'air',   status:'upcoming', viewers:'in 2h', place:'Cappadocia, TR' },
  { name:'Ridgeline Trail Run',   activity:'50k ultra through the Dolomites',           lat:46.41, lon:11.85,  cat:'land',  status:'live',     viewers:'864',  place:'Dolomites, IT' },
  { name:'Night Market Ride',     activity:'Moped POV through the old quarter',         lat:21.03, lon:105.85, cat:'land',  status:'live',     viewers:'3.4k', place:'Hanoi, VN' },
  { name:'Desert Camel Trek',     activity:'Three-day crossing to the dunes',           lat:31.63, lon:-7.99,  cat:'land',  status:'upcoming', viewers:'in 5h', place:'Marrakech, MA' },
  { name:'Reef Free Dive',        activity:'Free diving the outer reef wall',           lat:-18.29,lon:147.7,  cat:'water', status:'live',     viewers:'1.7k', place:'Great Barrier Reef, AU' },
  { name:'Fjord Kayak Crossing',  activity:'Open-water kayak between fjords',           lat:60.47, lon:6.6,    cat:'water', status:'live',     viewers:'512',  place:'Sognefjord, NO' },
  { name:'Monsoon Surf Session',  activity:'Dawn patrol before the swell peaks',        lat:-8.65, lon:115.13, cat:'water', status:'upcoming', viewers:'in 40m', place:'Bali, ID' },
  { name:'Glacier Paraglide',     activity:'Thermal soaring above the icefall',         lat:46.02, lon:7.75,   cat:'air',   status:'live',     viewers:'980',  place:'Zermatt, CH' },
  { name:'Rooftop Freerun',       activity:'Rooftop-to-rooftop parkour line',           lat:35.68, lon:139.69, cat:'land',  status:'live',     viewers:'5.2k', place:'Tokyo, JP' },
  { name:'Canyon Rappel',         activity:'Multi-pitch descent into slot canyon',      lat:37.0,  lon:-111.5, cat:'land',  status:'upcoming', viewers:'in 3h', place:'Utah, US' },
  { name:'Ice Dive Under the Floe',activity:'Dive beneath the frozen sound',            lat:-77.85,lon:166.67, cat:'water', status:'live',     viewers:'611',  place:'McMurdo Sound, AQ' },
  { name:'Coastal Hang Glide',    activity:'Ridge lift along the cliffs',               lat:-33.87,lon:151.21, cat:'air',   status:'live',     viewers:'1.2k', place:'Sydney, AU' },
  { name:'Highline Crossing',     activity:'Slackline between two peaks',               lat:46.55, lon:8.0,    cat:'air',   status:'upcoming', viewers:'in 1h', place:'Bernese Alps, CH' },
  { name:'River Rapids Run',      activity:'Whitewater kayak descent',                  lat:-0.19, lon:-78.47, cat:'water', status:'live',     viewers:'740',  place:'Quito, EC' },
];

// ------------------------------------------------------------------
// Scene
// ------------------------------------------------------------------
const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x05101f);
scene.fog = new THREE.FogExp2(0x05101f, 0.045);

const camera = new THREE.PerspectiveCamera(42, window.innerWidth/window.innerHeight, 0.1, 100);
camera.position.set(0, 0.6, 6.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.rotateSpeed = 0.55;
controls.enablePan = false;
controls.minDistance = 3.4;
controls.maxDistance = 9.5;
controls.autoRotate = !REDUCE_MOTION;
controls.autoRotateSpeed = 0.4;

let idleTimer = null;
function pauseAutoRotate(){
  controls.autoRotate = false;
  clearTimeout(idleTimer);
  idleTimer = setTimeout(()=>{ if(!REDUCE_MOTION) controls.autoRotate = true; }, 2600);
}
controls.addEventListener('start', pauseAutoRotate);

scene.add(new THREE.AmbientLight(0x9fb4d8, 0.85));
const key = new THREE.DirectionalLight(0xffffff, 0.4);
key.position.set(4,3,5);
scene.add(key);

// ------------------------------------------------------------------
// Starfield
// ------------------------------------------------------------------
(function buildStars(){
  const n = 1300;
  const pos = new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r = 18 + Math.random()*22;
    const th = Math.random()*Math.PI*2;
    const ph = Math.acos(2*Math.random()-1);
    pos[i*3]   = r*Math.sin(ph)*Math.cos(th);
    pos[i*3+1] = r*Math.sin(ph)*Math.sin(th);
    pos[i*3+2] = r*Math.cos(ph);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos,3));
  const mat = new THREE.PointsMaterial({ color:0xcfe3ff, size:0.026, transparent:true, opacity:0.5, sizeAttenuation:true });
  scene.add(new THREE.Points(geo, mat));
})();

// ------------------------------------------------------------------
// Globe texture — canvas-drawn, no external assets
// ------------------------------------------------------------------
function lonLatToXY(lon, lat, w, h){ return [ (lon+180)/360*w, (90-lat)/180*h ]; }
function pointInPolygon(x, y, poly){
  let inside = false;
  for(let i=0, j=poly.length-1; i<poly.length; j=i++){
    const xi=poly[i][0], yi=poly[i][1], xj=poly[j][0], yj=poly[j][1];
    const intersect = ((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi);
    if(intersect) inside = !inside;
  }
  return inside;
}

function buildGlobeTexture(){
  const W = 2048, H = 1024;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#081729');
  grad.addColorStop(0.5, '#0b1a2e');
  grad.addColorStop(1, '#081729');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  ctx.strokeStyle = 'rgba(20,215,255,0.12)';
  ctx.lineWidth = 1;
  for(let lon=-180; lon<=180; lon+=15){
    const [x] = lonLatToXY(lon,0,W,H);
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for(let lat=-75; lat<=75; lat+=15){
    const [,y] = lonLatToXY(0,lat,W,H);
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }

  const projected = CONTINENTS.map(poly => poly.map(([lon,lat]) => lonLatToXY(lon,lat,W,H)));

  const step = 6;
  for(let y=0; y<H; y+=step){
    for(let x=0; x<W; x+=step){
      let hit = false;
      for(const poly of projected){ if(pointInPolygon(x,y,poly)){ hit = true; break; } }
      if(!hit) continue;
      const jx = x + (Math.random()-0.5)*step*0.8;
      const jy = y + (Math.random()-0.5)*step*0.8;
      const r = 0.55 + Math.random()*0.9;
      const shade = 0.75 + Math.random()*0.35;
      ctx.beginPath();
      ctx.fillStyle = `rgba(${Math.round(78*shade)},${Math.round(140*shade)},${Math.round(160*shade)},${0.5+Math.random()*0.3})`;
      ctx.arc(jx, jy, r, 0, Math.PI*2);
      ctx.fill();
    }
  }

  ctx.strokeStyle = 'rgba(103,161,255,0.28)';
  ctx.lineWidth = 1.1;
  for(const poly of projected){
    ctx.beginPath();
    poly.forEach(([x,y],i)=> i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y));
    ctx.closePath();
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 8;
  tex.needsUpdate = true;
  return tex;
}

const globeTexture = buildGlobeTexture();
const globe = new THREE.Mesh(
  new THREE.SphereGeometry(R, 96, 96),
  new THREE.MeshStandardMaterial({ map:globeTexture, roughness:0.85, metalness:0.1 })
);
scene.add(globe);

// Atmosphere halo — cyan
const atmoMat = new THREE.ShaderMaterial({
  transparent:true, blending:THREE.AdditiveBlending, side:THREE.BackSide,
  uniforms:{ glowColor:{ value:new THREE.Color(0x14d7ff) } },
  vertexShader:`
    varying vec3 vNormal;
    void main(){
      vNormal = normalize(normalMatrix * normal);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }`,
  fragmentShader:`
    varying vec3 vNormal;
    uniform vec3 glowColor;
    void main(){
      float intensity = pow(0.62 - dot(vNormal, vec3(0.0,0.0,1.0)), 2.4);
      gl_FragColor = vec4(glowColor, intensity * 0.8);
    }`
});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(R*1.045, 96, 96), atmoMat));

// ------------------------------------------------------------------
// Live / upcoming points
// ------------------------------------------------------------------
function glowSprite(colorHex){
  const s = 128;
  const c = document.createElement('canvas');
  c.width = c.height = s;
  const ctx = c.getContext('2d');
  const col = new THREE.Color(colorHex);
  const rgb = `${Math.round(col.r*255)},${Math.round(col.g*255)},${Math.round(col.b*255)}`;
  const g = ctx.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2);
  g.addColorStop(0, `rgba(${rgb},0.95)`);
  g.addColorStop(0.35, `rgba(${rgb},0.45)`);
  g.addColorStop(1, `rgba(${rgb},0)`);
  ctx.fillStyle = g; ctx.fillRect(0,0,s,s);
  return new THREE.CanvasTexture(c);
}
const glowCache = {};
function getGlow(catKey){
  if(!glowCache[catKey]) glowCache[catKey] = glowSprite(CATS[catKey].hex);
  return glowCache[catKey];
}

function latLonToVec3(lat, lon, radius){
  const phi = (90-lat) * Math.PI/180;
  const theta = (lon+180) * Math.PI/180;
  return new THREE.Vector3(
    -radius*Math.sin(phi)*Math.cos(theta),
    radius*Math.cos(phi),
    radius*Math.sin(phi)*Math.sin(theta)
  );
}

const markers = new THREE.Group();
scene.add(markers);
const markerObjs = [];

POINTS.forEach((p, idx) => {
  const pos = latLonToVec3(p.lat, p.lon, R*1.008);
  const cat = CATS[p.cat];

  const haloMat = new THREE.SpriteMaterial({ map:getGlow(p.cat), transparent:true, depthWrite:false, blending:THREE.AdditiveBlending });
  const halo = new THREE.Sprite(haloMat);
  halo.position.copy(pos);
  halo.scale.setScalar(p.status === 'live' ? 0.38 : 0.24);
  markers.add(halo);

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(p.status === 'live' ? 0.023 : 0.017, 12, 12),
    new THREE.MeshBasicMaterial({ color: cat.hex })
  );
  core.position.copy(pos);
  core.userData = { ...p };
  markers.add(core);

  markerObjs.push({ halo, core, cat: p.cat, status: p.status, phase: idx*0.7 + Math.random()*2 });
});

// ------------------------------------------------------------------
// Filters (DOM)
// ------------------------------------------------------------------
const filtersEl = document.getElementById('filters');
const activeCats = new Set(Object.keys(CATS));

Object.entries(CATS).forEach(([key, cat]) => {
  const pill = document.createElement('div');
  pill.className = 'pill active';
  pill.style.setProperty('--pill-color', cat.css);
  pill.innerHTML = `<span class="dot" style="background:${cat.css}"></span>${cat.label}`;
  pill.addEventListener('click', () => {
    if(activeCats.has(key)){ activeCats.delete(key); pill.classList.remove('active'); pill.classList.add('dim'); }
    else { activeCats.add(key); pill.classList.add('active'); pill.classList.remove('dim'); }
    applyFilter();
  });
  filtersEl.appendChild(pill);
});

function applyFilter(){
  markerObjs.forEach(m => {
    const on = activeCats.has(m.cat);
    m.halo.visible = on;
    m.core.visible = on;
  });
  updateLiveCount();
}

function updateLiveCount(){
  const n = POINTS.filter(p => p.status === 'live' && activeCats.has(p.cat)).length;
  document.getElementById('liveCount').textContent = `${n} live now`;
}
updateLiveCount();

// ------------------------------------------------------------------
// Interaction — hover / tap
// ------------------------------------------------------------------
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(-10,-10);

const card = document.getElementById('card');
const cardDot = document.getElementById('cardDot');
const cardCat = document.getElementById('cardCat');
const cardStatus = document.getElementById('cardStatus');
const cardStatusText = document.getElementById('cardStatusText');
const cardTitle = document.getElementById('cardTitle');
const cardSub = document.getElementById('cardSub');
const cardViewers = document.getElementById('cardViewers');
const cardLocation = document.getElementById('cardLocation');
const cardBtn = document.getElementById('cardBtn');
const hint = document.getElementById('hint');

let hovered = null;

function showCard(data){
  const cat = CATS[data.cat];
  cardDot.style.background = cat.css;
  cardCat.textContent = cat.label;
  cardCat.style.color = cat.css;
  const isLive = data.status === 'live';
  cardStatus.className = 'card-status ' + (isLive ? 'live' : 'upcoming');
  cardStatusText.textContent = isLive ? 'Live' : 'Upcoming';
  cardTitle.textContent = data.name;
  cardSub.textContent = data.activity;
  cardViewers.textContent = isLive ? `${data.viewers} watching` : `Starts ${data.viewers}`;
  cardLocation.textContent = data.place;
  cardBtn.textContent = isLive ? 'Watch' : 'Remind me';
  card.classList.add('show');
  hint.style.opacity = '0';
}
function hideCard(){
  card.classList.remove('show');
  hint.style.opacity = '1';
}

function setPointer(e){
  const t = e.touches ? e.touches[0] : e;
  pointer.x = (t.clientX / window.innerWidth) * 2 - 1;
  pointer.y = -(t.clientY / window.innerHeight) * 2 + 1;
}

function checkHover(){
  raycaster.setFromCamera(pointer, camera);
  const visibleCores = markerObjs.filter(m => m.core.visible).map(m => m.core);
  const hits = raycaster.intersectObjects(visibleCores);
  if(hits.length){
    const obj = hits[0].object;
    if(hovered !== obj){
      hovered = obj;
      showCard(obj.userData);
      document.body.style.cursor = 'pointer';
    }
  } else if(hovered){
    hovered = null;
    hideCard();
    document.body.style.cursor = 'default';
  }
}

renderer.domElement.addEventListener('mousemove', (e)=>{ setPointer(e); checkHover(); });
renderer.domElement.addEventListener('touchstart', (e)=>{ setPointer(e); checkHover(); }, { passive:true });
renderer.domElement.addEventListener('touchmove', (e)=>{ setPointer(e); checkHover(); }, { passive:true });

// ------------------------------------------------------------------
// Animation loop
// ------------------------------------------------------------------
const clock = new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();

  if(!REDUCE_MOTION){
    markerObjs.forEach(m => {
      if(!m.halo.visible) return;
      const speed = m.status === 'live' ? 1.8 : 1.0;
      const base = m.status === 'live' ? 0.36 : 0.22;
      const pulse = 0.85 + Math.sin(t*speed + m.phase)*0.22;
      m.halo.scale.setScalar(base * pulse + 0.05);
      m.halo.material.opacity = 0.6 + Math.sin(t*speed + m.phase)*0.25;
    });
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

requestAnimationFrame(()=>{
  canvas.classList.add('ready');
  document.getElementById('ui').classList.add('ready');
});

window.addEventListener('resize', ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
